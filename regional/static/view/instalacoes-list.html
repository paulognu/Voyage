<div class="page-title">
	<div class="title_left">

</div>

<div class="clearfix"></div>

<div class="row">
	<div class="col-md-12 col-sm-12 col-xs-12">
		<div class="x_panel">
    		<div class="x_title">
      			<h2>Instalações <small>Consulta</small></h2>
		    	
		    	<div class="clearfix"></div>

    		</div>
    			
			<div class="x_content">

  				<form class="form-horizontal form-label-left" novalidate>

			        <div class="item form-group">
				        <label class="control-label col-md-3 col-sm-3 col-xs-12" for="name">Busca
				        </label>
			        	<div class="col-md-6 col-sm-6 col-xs-12">
			            	<input id="name" class="form-control col-md-7 col-xs-12" name="name" placeholder="Informe o nome, sigla ou tipo da Instalação" required="required" type="text" ng-model="filtro" ng-change="carregarInstalacoesList(filtro);">
			        	</div>
			        </div>
			        
			    </form>

			    <h2>Lista de Instalações</h2>
			    <div class="clearfix"></div>

			    <table class="table">
			    	<thead>
			    		<th>Nome</th>
              <th>Sigla</th>
              <th>Tipo</th>
              <th>Unidade</th>
			    		<th>
                <a href="#/instalacoes-detail/null/" class="btn btn-primary btn-xs">Novo</a>
                <a onclick="window.history.back();" class="btn btn-primary btn-xs">Voltar</a>
              </th>              
			    	</thead>
			    	<tbody>
			    		<tr ng-repeat="instalacao in instalacoes">
                <td>{{ instalacao.nome }}</td>
                <td>{{ instalacao.sigla }}</td>
                <td>{{ instalacao.tipo_nome }}</td>
                <td>{{ instalacao.unidade_sigla }}</td>
                <td>
                  <a class="btn btn-primary btn-xs" href="#/instalacoes-detail/{{ instalacao.id }}/">Detalhes </a>
                  <a class="btn btn-primary btn-xs" href="#/equipamentos-list/?instalacao={{ instalacao.id }}">Equipamentos </a>
                  <a class="btn btn-primary btn-xs" href="#/alimentadores-list/?instalacao={{ instalacao.id }}">Alimentadores </a>                  
                </td>
			    		</tr>
			    	</tbody>
			    </table>
			</div>
		</div>
	</div>
</div>
