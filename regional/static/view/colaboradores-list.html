<div class="page-title">
	<div class="title_left">
		<h3>
	    </h3>
	</div>

</div>

<div class="clearfix"></div>

<div class="row">
	<div class="col-md-12 col-sm-12 col-xs-12">
		<div class="x_panel">
    		<div class="x_title">
      			<h2>Busca <small>Colaboradores </small></h2>
		    	
		    	<div class="clearfix"></div>

    		</div>
    			
			<div class="x_content">

  				<form class="form-horizontal form-label-left" novalidate>

			        <div class="item form-group">
				        <label class="control-label col-md-3 col-sm-3 col-xs-12" for="name">Busca
				        </label>
			        	<div class="col-md-6 col-sm-6 col-xs-12">
			            	<input id="name" class="form-control col-md-7 col-xs-12" name="name" placeholder="Informe a matrícula, nome ou email do colaborador" required="required" type="text" ng-model="filtro" ng-change="carregarColaboradoresList(filtro);">
			        	</div>
			        </div>

			    </form>

			    <h2>Lista de Colaboradores</h2>
			    <div class="clearfix"></div>

			    <table class="table">
			    	<thead>
			    		<th>Matrícula</th>
			    		<th>Nome</th>
			    		<th>Email</th>
			    		<th>Divisão</th>
			    		<th>
			    			<a href="#/colaboradores-detail/null/" class="btn btn-primary btn-xs">Novo</a>
			    			<a onclick="window.history.back();" class="btn btn-primary btn-xs">Voltar</a>
			    		</th>
			    	</thead>
			    	<tbody>
			    		<tr ng-repeat="colaborador in colaboradores">
			    			<td>{{ colaborador.matricula }}</td>
			    			<td>{{ colaborador.nome_completo }}</td>
			    			<td>{{ colaborador.email }}</td>
			    			<td>{{ colaborador.divisao_sigla }}</td>
			    			<td><a class="btn btn-primary btn-xs" href="#/colaboradores-detail/{{ colaborador.id }}/">Detalhes </a></td>
			    		</tr>
			    	</tbody>
			    </table>
			</div>
		</div>
	</div>
</div>
