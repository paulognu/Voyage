<div class="row">
	<div class="col-md-12 col-sm-12 col-xs-12">
		<div class="x_panel">
    		<div class="x_title">
      			<h2>Unidades <small>Consulta</small></h2>
		    	
		    	<div class="clearfix"></div>

    		</div>
    			
			<div class="x_content">

  				<form class="form-horizontal form-label-left" novalidate>

			        <div class="item form-group">
				        <label class="control-label col-md-3 col-sm-3 col-xs-12" for="name">Busca
				        </label>
			        	<div class="col-md-6 col-sm-6 col-xs-12">
			            	<input id="name" class="form-control col-md-7 col-xs-12" name="name" placeholder="Informe o nome ou a sigla da Unidade" required="required" type="text" ng-model="filtro" ng-change="carregarUnidadesList(filtro);">
			        	</div>
			        </div>
			        
			    </form>

			    <h2>Lista de Unidades</h2>
			    <div class="clearfix"></div>

			    <table class="table">
			    	<thead>
			    		<th>Nome</th>
			    		<th>Sigla</th>
			    		<th>
                <a href="#/unidades-detail/null/" class="btn btn-primary btn-xs">Novo</a>
                <a onclick="window.history.back();" class="btn btn-primary btn-xs">Voltar</a>
              </th>
			    	</thead>
			    	<tbody>
			    		<tr ng-repeat="unidade in unidades">
			    			<td>{{ unidade.nome }}</td>
			    			<td>{{ unidade.sigla }}</td>
			    			<td><a class="btn btn-primary btn-xs" href="#/unidades-detail/{{ unidade.id }}/">Detalhes </a></td>
			    		</tr>
			    	</tbody>
			    </table>
			</div>
		</div>
	</div>
</div>
